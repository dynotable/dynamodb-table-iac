# dynamodb-table-iac: CloudFormation for DynamoDB table "ledger"
# Source: aws dynamodb describe-table, region us-east-1
AWSTemplateFormatVersion: "2010-09-09"
Description: "DynamoDB table ledger, generated by dynamodb-table-iac from describe-table output"
Metadata:
  DynoTable:
    Source: "aws dynamodb describe-table, region us-east-1"
    NotEmitted:
      - "point-in-time recovery (DescribeTable does not return it; a replica declared without it has PITR off)"
      - "tags (DescribeTable does not return them; applying removes live tags)"
      - "auto-scaling policies (a fixed capacity snapshot is emitted instead; applying replaces the policy with that snapshot)"
      - "warm throughput (DescribeTable reports the CURRENT value, which grows with traffic; emitting it would bill a pre-warm)"
      - "contributor insights, Kinesis streaming destinations and resource policies (DescribeTable does not return them)"
      - "the KMS key ARN of an SSE-encrypted table (DescribeTable cannot tell an AWS-managed key from a customer-managed one; the AWS-managed key is emitted and the live ARN is left in a comment)"
      - "settings of non-home replicas that DynamoDB never synchronizes (their deletion protection, PITR and tags are only visible from their own region)"
    Notes:
      - "TTL: not provided — include the output of `aws dynamodb describe-time-to-live` to add it."
      - "Provisioned write capacity is emitted as write auto-scaling with min = max = the current WCU (AWS::DynamoDB::GlobalTable accepts no fixed write capacity); the live scaling policy is not part of DescribeTable."
    Adopt: "To adopt the live table instead of creating a new one, bring it into a stack with resource import (aws cloudformation create-stack --import-existing-resources, or an IMPORT change set); DeletionPolicy Retain is set, as import requires."
Resources:
  "Ledger":
    Type: AWS::DynamoDB::GlobalTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: "ledger"
      BillingMode: PROVISIONED
      AttributeDefinitions:
        - AttributeName: "pk"
          AttributeType: "S"
        - AttributeName: "sk"
          AttributeType: "S"
        - AttributeName: "account"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "pk"
          KeyType: HASH
        - AttributeName: "sk"
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: "by-account"
          KeySchema:
            - AttributeName: "account"
              KeyType: HASH
            - AttributeName: "sk"
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          WriteProvisionedThroughputSettings:
            WriteCapacityAutoScalingSettings:
              MinCapacity: 4
              MaxCapacity: 4
              TargetTrackingScalingPolicyConfiguration:
                TargetValue: 70
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      WriteProvisionedThroughputSettings:
        WriteCapacityAutoScalingSettings:
          MinCapacity: 10
          MaxCapacity: 10
          TargetTrackingScalingPolicyConfiguration:
            TargetValue: 70
      Replicas:
        - Region: us-east-1
          DeletionProtectionEnabled: true
          ReadProvisionedThroughputSettings:
            ReadCapacityUnits: 20
          GlobalSecondaryIndexes:
            - IndexName: "by-account"
              ReadProvisionedThroughputSettings:
                ReadCapacityUnits: 8
        - Region: eu-west-1
          ReadProvisionedThroughputSettings:
            ReadCapacityUnits: 7
          GlobalSecondaryIndexes:
            - IndexName: "by-account"
              ReadProvisionedThroughputSettings:
                ReadCapacityUnits: 3
